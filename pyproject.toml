[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "test-obuna-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.15,<4", "SQLAlchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "redis>=5,<8", "PyMuPDF>=1.25,<2", "Pillow>=11,<13", "openpyxl>=3.1,<4", "APScheduler>=3.11,<4", "pydantic-settings>=2.7,<3", "tzdata>=2024.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=6", "ruff>=0.9", "aiosqlite>=0.20"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.package-data]
app = ["locales/*.json"]

